name: growth-assistant

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmer}
      POSTGRES_DB: ${POSTGRES_DB:-growth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmer} -d ${POSTGRES_DB:-growth}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      TZ: Europe/Moscow
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farmer}:${POSTGRES_PASSWORD:-farmer}@db:5432/${POSTGRES_DB:-growth}
      JWT_SECRET: ${JWT_SECRET:-demo-secret-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
